<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutero de Farmacias por Días</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rutero de Farmacias</h1>
        <div class="tabs">
            <button class="tab-btn active" data-day="dia1">Día 1</button>
            <button class="tab-btn" data-day="dia2">Día 2</button>
            <button class="tab-btn" data-day="dia3">Día 3</button>
            <button class="tab-btn" data-day="dia4">Día 4</button>
            <button class="tab-btn" data-day="dia5">Día 5</button>
            <button class="tab-btn" data-day="dia6">Día 6</button>
        </div>
        <div class="stats">
            <span id="visited-count">0</span> visitadas de <span id="total-count">0</span>
        </div>
        <input type="text" id="search-input" placeholder="Buscar farmacia...">
        <ul id="pharmacy-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
